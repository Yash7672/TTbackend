# Test profile — H2 in-memory database so unit/integration tests never need MySQL.
spring.datasource.url=jdbc:h2:mem:fixora_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Deterministic AI during tests
fixora.ai.provider=fallback
fixora.ai.anthropic.api-key=
fixora.seed.enabled=false

logging.level.root=WARN
logging.level.com.fixora=INFO
