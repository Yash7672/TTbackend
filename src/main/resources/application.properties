# ===========================================================================
# FIXORA backend — application configuration
# ===========================================================================

spring.application.name=fixora

server.port=8080
server.error.include-message=always

# ------------------------------- Datasource --------------------------------
# Defaults target a locally running MySQL. Docker Compose overrides these with
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD pointing at the `mysql` service.
spring.datasource.url=jdbc:mysql://localhost:3307/fixora_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:yashwanth}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------- JPA / Hibernate ---------------------------
# `update` creates missing tables/columns on startup (development convenience).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# -------------------------------- JSON --------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# -------------------------------- Uploads -----------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
fixora.upload.directory=uploads

# -------------------------------- Seed data ---------------------------------
# Loads the demo catalogue once (idempotent). Set false for an empty database.
fixora.seed.enabled=${FIXORA_SEED_ENABLED:true}

# ----------------------------------- AI -------------------------------------
# provider=fallback  -> deterministic, catalogue-driven assistant (no key needed)
# provider=anthropic -> backend-only Anthropic API calls
fixora.ai.provider=${FIXORA_AI_PROVIDER:fallback}
fixora.ai.anthropic.api-key=${FIXORA_AI_ANTHROPIC_API_KEY:}
fixora.ai.model=${FIXORA_AI_MODEL:}
fixora.ai.timeout-seconds=${FIXORA_AI_TIMEOUT_SECONDS:20}
fixora.ai.anthropic.base-url=https://api.anthropic.com/v1/messages
fixora.ai.anthropic.version=2023-06-01
fixora.ai.anthropic.max-tokens=1024

# ------------------------------- Logging ------------------------------------
logging.level.root=INFO
logging.level.com.fixora=INFO

