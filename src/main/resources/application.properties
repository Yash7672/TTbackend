# ===========================================================================
# FIXORA backend — application configuration
# ===========================================================================

spring.application.name=fixora

# Lets a local `.env` file (KEY=VALUE) supply the environment variables below for
# plain `mvn spring-boot:run` / `java -jar` runs. It is optional and absent inside
# Docker and CI, where the variables are injected by the container runtime instead.
spring.config.import=optional:file:.env[.properties]

server.port=8080
server.error.include-message=always

# ------------------------------- Datasource --------------------------------
# Every value is environment-driven, so no credentials live in the repository:
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#
# Default (no env): a locally running MySQL, e.g. the Docker Compose stack.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/fixora_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:yashwanth}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#
# ---------------------- Managed MySQL over TLS (Aiven) ----------------------
# Point SPRING_DATASOURCE_URL at the server with CA verification enabled, e.g.
# for Docker/Render:
#   SPRING_DATASOURCE_URL=jdbc:mysql://<host>:<port>/<database>?sslMode=VERIFY_CA&serverTimezone=UTC
# The truststore anchoring CA verification is supplied separately, so its
# password stays its own secret instead of living inside the JDBC URL. Inside
# the container the path is the Linux default set by the Dockerfile:
#   SPRING_DATASOURCE_SSL_TRUSTSTORE_URL=file:/app/certs/aiven-truststore.p12
#   SPRING_DATASOURCE_SSL_TRUSTSTORE_TYPE=PKCS12
#   SPRING_DATASOURCE_SSL_TRUSTSTORE_PASSWORD=<truststore password>
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${SPRING_DATASOURCE_SSL_TRUSTSTORE_URL:}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=${SPRING_DATASOURCE_SSL_TRUSTSTORE_TYPE:PKCS12}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${SPRING_DATASOURCE_SSL_TRUSTSTORE_PASSWORD:}

# -------------------------------- JPA / Hibernate ---------------------------
# `update` creates missing tables/columns on startup (development convenience).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# -------------------------------- JSON --------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# -------------------------------- Uploads -----------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
fixora.upload.directory=uploads

# -------------------------------- Seed data ---------------------------------
# Loads the demo catalogue once (idempotent). Set false for an empty database.
fixora.seed.enabled=${FIXORA_SEED_ENABLED:true}

# ----------------------------------- AI -------------------------------------
# provider=fallback  -> deterministic, catalogue-driven assistant (no key needed)
# provider=anthropic -> backend-only Anthropic API calls
fixora.ai.provider=${FIXORA_AI_PROVIDER:fallback}
fixora.ai.anthropic.api-key=${FIXORA_AI_ANTHROPIC_API_KEY:}
fixora.ai.model=${FIXORA_AI_MODEL:}
fixora.ai.timeout-seconds=${FIXORA_AI_TIMEOUT_SECONDS:20}
fixora.ai.anthropic.base-url=https://api.anthropic.com/v1/messages
fixora.ai.anthropic.version=2023-06-01
fixora.ai.anthropic.max-tokens=1024

# ------------------------------- Logging ------------------------------------
logging.level.root=INFO
logging.level.com.fixora=INFO

